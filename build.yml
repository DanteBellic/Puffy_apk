name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/index.html
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - run: npx cap add android
      - name: Landscape and fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&<item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: puffy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
